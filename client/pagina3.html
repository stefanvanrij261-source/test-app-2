<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onze scholen</title>
    <link rel="stylesheet" href="style.css">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    :root {
      --blue: #38B6FF;
      --text: #1f2937;
      --muted: #6b7280;
      --bg-soft: #f8fafc;
      --white: #ffffff;
      --border: #d1d5db;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: #f3f7fb;
      line-height: 1.4;
    }

    .page {
      max-width: 1100px;
      margin: 28px auto 42px;
      padding: 0 16px;
    }

    h1 {
      text-align: center;
      color: var(--blue);
      margin: 8px 0 24px;
      font-size: clamp(1.7rem, 3vw, 2.3rem);
    }

    .card {
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      padding: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 10px;
    }

    #addressInput {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
    }

    #searchButton {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      background: var(--blue);
      color: var(--white);
      font-weight: 700;
      cursor: pointer;
    }

    #schoolMap {
      width: 100%;
      height: 540px;
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.06);
      margin: 10px 0 14px;
    }

    #statusMessage {
      margin: 0;
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .results-title {
      margin: 8px 0 8px;
      font-size: 15px;
      font-weight: 700;
    }

    #nearestSchools {
      list-style-position: inside;
      margin: 0;
      padding: 10px 12px;
      background: var(--bg-soft);
      border-radius: 10px;
    }

    #nearestSchools li {
      padding: 3px 0;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .controls {
        grid-template-columns: 1fr;
      }

      #searchButton {
        width: 100%;
      }

      #schoolMap {
        height: 460px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Onze scholen</h1>

    <section class="card" aria-label="Kaart en schoolzoeker">
      <div class="controls">
        <input id="addressInput" type="text" placeholder="Vul adres in" aria-label="Vul adres in">
        <button id="searchButton" type="button">Zoeken</button>
      </div>

      <p id="statusMessage" aria-live="polite"></p>
      <div id="schoolMap" aria-label="Kaart met schoollocaties"></div>

      <p class="results-title">Scholen op afstand (dichtstbij eerst)</p>
      <ol id="nearestSchools"></ol>
      <p class="hint">Tip: beweeg met je muis over een blauwe marker om naam en adres te zien.</p>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    const schoolLocations = [
      { name: 'CBS De Ark', address: 'Klipper 108-109, 2991 KM Barendrecht', lat: 51.85667, lon: 4.53472 },
      { name: 'CBS De Bongerd', address: 'Patrijs 28-29, 2986 CA Ridderkerk', lat: 51.8646633, lon: 4.6135642 },
      { name: 'CBS De Fontein', address: 'Scheldeplein 4, 2987 EL Ridderkerk', lat: 51.8912258, lon: 4.5790103 },
      { name: 'CBS De Hoeksteen', address: 'Kruidentuin 6A, 2991 RK Barendrecht', lat: 51.852674755859375, lon: 4.547271728515625 },
      { name: 'CBS De Klimop', address: 'Meester Treubstraat 3, 2982 VN Ridderkerk', lat: 51.871284, lon: 4.5914643 },
      { name: 'CBS De Regenboog', address: 'Reijerweg 60, 2983 AT Ridderkerk', lat: 51.885218, lon: 4.6051965 },
      { name: 'CBS De Vrijenburg', address: 'Vrijenburglaan 61, 2994 CD Barendrecht', lat: 51.8589301, lon: 4.5062779 },
      { name: 'CBS De Wingerd', address: 'Da Costalaan 3, 2985 BC Ridderkerk', lat: 51.8627854, lon: 4.6042018 },
      { name: 'CBS Groen van Prinsterer (Stellingmolen)', address: 'Stellingmolen 10, 2992 DN Barendrecht', lat: 51.85, lon: 4.5295 },
       { name: 'CBS Groen van Prinsterer (Hof van Maxima)', address: 'Hedwigepolder 2, 2992 TS Barendrecht', lat: 51.845301, lon: 4.5265 },
      { name: 'CBS Het Kompas', address: 'Hoefslag 20, 2992 VH Barendrecht', lat: 51.8569395, lon: 4.5293586 },
      { name: 'CBS Smitshoek (Riederhof)', address: 'Riederhof 37, 2993 XJ Barendrecht', lat: 51.85424313964844, lon: 4.491832669830322 },
      { name: 'CBS Smitshoek (Brandsma-akker)', address: 'Brandsma-akker 3, 2994 AA Barendrecht', lat: 51.857628411865234, lon: 4.493868350982666 },
      { name: 'CBS Smitshoek (Kouwenhoven-akker)', address: 'Kouwenhoven-akker 14, 2994 AS Barendrecht', lat: 51.8597538, lon: 4.4940023 },
      { name: 'PCPO Bestuursbureau', address: 'Achterom 70, 2991 CV Barendrecht', lat: 51.85496, lon: 4.5384424 }
    ];

    const map = L.map('schoolMap').setView([51.8575, 4.55], 12);
    const addressInput = document.getElementById('addressInput');
    const searchButton = document.getElementById('searchButton');
    const statusMessage = document.getElementById('statusMessage');
    const nearestSchools = document.getElementById('nearestSchools');

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let userMarker = null;
    const schoolMarkersLayer = L.layerGroup().addTo(map);

    const redIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const blueIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    function setStatus(message) {
      statusMessage.textContent = message;
    }

    function haversineDistanceKm(lat1, lon1, lat2, lon2) {
      const toRad = (deg) => deg * (Math.PI / 180);
      const earthRadiusKm = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2
        + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return earthRadiusKm * c;
    }

    function renderSchoolMarkers() {
      const bounds = L.latLngBounds();
      schoolMarkersLayer.clearLayers();

      schoolLocations.forEach((school) => {
        const marker = L.marker([school.lat, school.lon], { icon: blueIcon }).addTo(schoolMarkersLayer);

        marker.bindTooltip(`<strong>${school.name}</strong><br>${school.address}`, {
          direction: 'top',
          sticky: true,
          opacity: 0.95
        });

        marker.on('mouseover', () => marker.openTooltip());
        marker.on('mouseout', () => marker.closeTooltip());

        bounds.extend([school.lat, school.lon]);
      });

      if (bounds.isValid()) {
        map.fitBounds(bounds.pad(0.12));
      }
    }

    function renderNearestSchools(userLat, userLon) {
      nearestSchools.innerHTML = '';

      const sortedSchools = schoolLocations
        .map((school) => ({
          ...school,
          distance: haversineDistanceKm(userLat, userLon, school.lat, school.lon)
        }))
        .sort((a, b) => a.distance - b.distance);

      sortedSchools.forEach((school) => {
        const li = document.createElement('li');
        li.textContent = `${school.name} - ${school.distance.toFixed(2)} km`;
        nearestSchools.appendChild(li);
      });
    }

    async function fetchJson(endpoint) {
      const response = await fetch(endpoint);

      if (!response.ok) {
        throw new Error('Adres opzoeken mislukt');
      }

      return response.json();
    }

    async function geocodeAddress(address) {
      const query = encodeURIComponent(`${address}, Nederland`);
      const nominatimEndpoint = `https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=nl&q=${query}`;

      try {
        const nominatimData = await fetchJson(nominatimEndpoint);
        if (nominatimData.length) {
          return {
            lat: Number(nominatimData[0].lat),
            lon: Number(nominatimData[0].lon)
          };
        }
      } catch (error) {
        console.warn('Nominatim lookup failed, trying Photon fallback.', error);
      }

      const photonEndpoint = `https://photon.komoot.io/api/?limit=1&lang=nl&q=${query}`;
      const photonData = await fetchJson(photonEndpoint);
      const firstFeature = photonData.features?.[0];

      if (!firstFeature) {
        return null;
      }

      return {
        lat: Number(firstFeature.geometry.coordinates[1]),
        lon: Number(firstFeature.geometry.coordinates[0])
      };
    }

    async function handleSearch() {
      const inputValue = addressInput.value.trim();
      if (!inputValue) {
        setStatus('Vul eerst een adres in.');
        return;
      }

      setStatus('Adres zoeken...');
      searchButton.disabled = true;

      try {
        const location = await geocodeAddress(inputValue);
        if (!location) {
          setStatus('Adres niet gevonden. Probeer een vollediger adres.');
          return;
        }

        if (userMarker) {
          map.removeLayer(userMarker);
        }

        userMarker = L.marker([location.lat, location.lon], { icon: redIcon }).addTo(map);
        userMarker.bindTooltip('Jouw adres', {
          direction: 'top',
          sticky: true,
          opacity: 0.95
        }).openTooltip();

        renderNearestSchools(location.lat, location.lon);
        map.setView([location.lat, location.lon], 13);
        setStatus('Adres gevonden. Scholen staan hieronder van dichtbij naar verder.');
      } catch (error) {
        console.error(error);
        setStatus('Zoeken mislukt. Controleer het adres en probeer opnieuw.');
      } finally {
        searchButton.disabled = false;
      }
    }

    searchButton.addEventListener('click', handleSearch);
    addressInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        handleSearch();
      }
    });

    renderSchoolMarkers();
    setStatus('Beweeg met de muis over een marker om naam en adres te zien.');
  </script>
  <!-- Arrow button -->
  <button id="menuToggle">➤</button>

  <!-- Side menu -->
  <nav id="sideMenu">
    <a href="pagina1.html">Schoolinformatie</a>
    <a href="pagina2.html">Welke school past bij jouw kind?</a>
    <a href="pagina3.html">Onze scholen</a>
    <a href="pagina4.html">Contact</a>
    <a href="index.html" style="padding: 40px; display:block;"> home </a>
  </nav>
   <script src="app.js"></script>
</body>
</html>
