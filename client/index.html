<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="metaTitleHome">Home</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .logo-container {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo-container img {
      width: 160px;
      height: auto;
    }

    .white-cover {
      position: fixed;
      top: 28px;
      left: 6px;
      width: 180px;
      height: 57px;
      background: white;
      z-index: 3050;
      border-radius: 4px;
    }

    .index-page #menuToggle {
      border: 1.5px solid #000 !important;
    }
  </style>
</head>

<body class="index-page home-page" style="
  margin: 0 !important;
  height: 100vh !important;
  background-image: url('/images/achtergrond2.png') !important;
  background-size: 100% !important;
  background-position: center -5% !important;
  background-repeat: no-repeat !important;
">
  <div class="top-overlay-image" aria-hidden="true"></div>
  
  <div class="white-cover"></div>
  
  <div class="logo-container">
    <img src="images/logo.png" alt="PCPO Logo" data-i18n-alt="logoAlt">
  </div>
  
  <div class="translate-controls" id="translateControls">
    <button id="languageToggle" class="language-toggle" type="button" aria-expanded="false" aria-controls="languageMenu" aria-label="Kies een taal" data-i18n-aria-label="translateAria">
      <span id="languageToggleFlag">🇳🇱 / 🇳🇱</span>
    </button>
    <div id="languageMenu" class="language-menu" hidden>
      <button type="button" data-language-option="nl">🇳🇱 NL</button>
      <button type="button" data-language-option="en">🇬🇧 EN</button>
      <button type="button" data-language-option="de">🇩🇪 DE</button>
      <button type="button" data-language-option="fr">🇫🇷 FR</button>
      <button type="button" data-language-option="es">🇪🇸 ES</button>
    </div>
    <label for="languageSelect" class="sr-only" data-i18n="translateLabel">Vertaal de hele pagina:</label>
    <select id="languageSelect" aria-label="Kies een taal" class="sr-only" data-i18n-aria-label="translateAria">
      <option value="nl">Nederlands</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </select>
  </div>
  <nav id="sideMenu">
    <a href="pagina1.html" data-i18n="navSchoolInfo">Over PCPO</a>
    <a href="pagina2.html" data-i18n="navSchoolFit">Welke school past bij jouw kind?</a>
    <a href="pagina3.html" data-i18n="navSchools">Onze scholen</a>
    <a href="pagina4.html" data-i18n="navContact">Contact</a>
  </nav>

  <div class="slideshow-container2">
    <div class="slide"><img src="images/slideshow1.png" alt=""></div>
    <div class="slide"><img src="images/slideshow2.png" alt=""></div>
    <div class="slide"><img src="images/slideshow3.png" alt=""></div>
    <div class="slide"><img src="images/slideshow4.png" alt=""></div>
    <div class="slide"><img src="images/slideshow5.png" alt=""></div>
  </div>

  <button id="menuToggle">➤</button>

  <script src="/app.js"></script>
</body>
</html>
